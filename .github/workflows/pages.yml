# Publishes site/ to GitHub Pages (https://joxemari.github.io/eki-labs-preview/).
# It keeps the old preview link and the images of the email signatures made before go-live working.
# Production (ekilabs.com) is deployed by Cloudflare Pages from this same repo, not by this workflow.
# Requires Settings › Pages › Build and deployment › Source: GitHub Actions.
name: GitHub Pages (preview)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
