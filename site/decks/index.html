<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Slides · Eki · Preview</title>
<link rel="icon" href="../favicon.ico" sizes="32x32">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
:root{--noche:#0a100c;--panel:#141b16;--linea:#2b332d;--arena:#f4f2ec;--niebla:#a1a69f;--yerba:#58e9ae;--sol:#ffd54a;
--fh:'Zilla Slab',Georgia,serif;--fb:'Work Sans',Arial,sans-serif;--fm:'Geist Mono',Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--noche);color:var(--arena);font-family:var(--fb)}
button{font:inherit;color:inherit}
.hidden{display:none!important}
.label{font-family:var(--fm);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--niebla)}
/* gate */
#gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.gate-card{width:min(440px,100%);display:flex;flex-direction:column;gap:22px;padding:36px;border-radius:16px;background:var(--panel)}
.gate-card h1{margin:0;font-family:var(--fh);font-weight:400;font-size:40px;line-height:1.05}
.gate-card p{margin:0;color:var(--niebla);font-size:16px;line-height:24px}
.gate-row{display:flex;gap:10px}
.gate-row input{flex:1;min-width:0;height:48px;padding:0 14px;border-radius:6px;border:1px solid var(--linea);background:var(--noche);color:var(--arena);font:500 15px var(--fm)}
.gate-row input:focus-visible,.btn:focus-visible,.icon:focus-visible,.card:focus-visible{outline:2px solid var(--yerba);outline-offset:2px}
.btn{height:48px;padding:0 18px;border:0;border-radius:6px;background:var(--yerba);color:var(--noche);font:500 14px var(--fm);cursor:pointer}
.err{color:#e89a80;font-size:14px;min-height:20px}
/* top bar */
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:20px;height:64px;padding:0 24px;background:rgba(10,16,12,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--linea)}
.bar .sp{flex:1}
.lang{display:inline-flex;border:1px solid var(--linea);border-radius:6px;overflow:hidden}
.lang span{padding:7px 10px;font:500 12px var(--fm);letter-spacing:.04em}
.lang .on{background:var(--arena);color:var(--noche)}
.lang .off{color:var(--niebla)}
.icon{height:40px;min-width:40px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--linea);border-radius:6px;background:transparent;cursor:pointer;font:500 13px var(--fm)}
/* home */
#home main{max-width:1280px;margin:0 auto;padding:48px 24px 64px;display:flex;flex-direction:column;gap:32px}
#home h1{margin:0;font-family:var(--fh);font-weight:400;font-size:clamp(40px,5vw,64px);line-height:1.02}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:14px;padding:14px 14px 18px;border-radius:14px;background:var(--panel);border:1px solid transparent;cursor:pointer;text-align:left}
.card:hover{border-color:var(--linea)}
.card h2{margin:0;font-family:var(--fh);font-weight:400;font-size:28px}
.card p{margin:0;color:var(--niebla);font-size:15px;line-height:22px}
.thumb{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:8px;background:#000}
.thumb .slide{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
/* viewer */
#viewer{height:100%;display:flex;flex-direction:column}
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
#frame{position:relative;width:1920px;height:1080px;transform-origin:center;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:1px solid var(--linea);background:rgba(10,16,12,.7);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:3}
.nav.prev{left:16px}.nav.next{right:16px}
.foot{display:flex;align-items:center;gap:16px;height:52px;padding:0 24px;border-top:1px solid var(--linea)}
#grid{position:fixed;inset:64px 0 0 0;z-index:6;background:rgba(10,16,12,.97);overflow:auto;padding:24px}
#grid .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;max-width:1600px;margin:0 auto}
#grid button{padding:0;border:2px solid transparent;border-radius:8px;background:none;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left}
#grid button[aria-current]{border-color:var(--yerba)}
#grid .n{font:500 12px var(--fm);color:var(--niebla);padding:0 4px 4px}
/* slide content: the same base the decks use */
.slide{width:1920px;height:1080px}
.slide *{margin:0;padding:0;box-sizing:border-box}
.slide section{position:relative;width:1920px;height:1080px;overflow:hidden}
.slide section > *:not([style*="position:absolute"]){position:relative}
.slide td,.slide th{padding:.35em .6em;border-bottom:1px solid rgba(128,128,128,.35)}
.slide aside{display:none}
@media (max-width:640px){.bar{gap:10px;padding:0 12px}.bar .hide-s{display:none}.nav{width:40px;height:40px}}
</style>
</head>

<section id="viewer" class="hidden">
  <div class="bar">
    <button class="icon" id="back" aria-label="All decks">←<span class="hide-s">Decks</span></button>
    <strong id="dtitle" style="font-family:var(--fh);font-weight:400;font-size:22px"></strong>
    <span class="label hide-s" id="dsection"></span>
    <span class="sp"></span>
    <span class="lang hide-s" title="Spanish version coming soon"><span class="on">EN</span><span class="off">ES · soon</span></span>
    <button class="icon" id="gridBtn" aria-label="All slides">▦</button>
  </div>
  <div id="stage">
    <button class="nav prev" id="prev" aria-label="Previous slide">‹</button>
    <div id="frame" class="slide"></div>
    <button class="nav next" id="next" aria-label="Next slide">›</button>
  </div>
  <div class="foot"><span class="label" id="counter"></span><span class="sp" style="flex:1"></span><span class="label hide-s">← → to move · G for all slides</span></div>
</section>

<section id="grid" class="hidden" aria-label="All slides"><div class="g" id="gridList"></div></section>

<script>
(function () {
  var DATA = null, deck = null, idx = 0;
  var $ = function (id) { return document.getElementById(id); };
  var b64 = function (s) { var bin = atob(s), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; };
  function store(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k, v); } catch (e) { return null; } }

  async function unlock(pw) {
    var r = await fetch('bundle.enc.json', { cache: 'no-store' }); var j = await r.json();
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(j.salt), iterations: j.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(j.iv) }, key, b64(j.ct));
    return JSON.parse(new TextDecoder().decode(plain));
  }

  function videos(root, play) {
    root.querySelectorAll('img[data-video]').forEach(function (img) {
      if (!play) return;
      var v = document.createElement('video');
      v.setAttribute('style', img.getAttribute('style') || ''); v.poster = img.getAttribute('src'); v.src = img.getAttribute('data-video');
      v.muted = true; v.autoplay = true; v.loop = true; v.playsInline = true; v.setAttribute('aria-label', img.alt || '');
      img.replaceWith(v); var p = v.play(); if (p && p.catch) p.catch(function () {});
    });
  }
  function mini(html, box, w) {
    var s = document.createElement('div'); s.className = 'slide'; s.innerHTML = html; s.style.transform = 'scale(' + (w / 1920) + ')';
    box.appendChild(s);
  }

  function showHome() {
    $('gate').classList.add('hidden'); $('viewer').classList.add('hidden'); $('grid').classList.add('hidden'); $('home').classList.remove('hidden');
    var c = $('cards'); if (c.childElementCount) return;
    DATA.decks.forEach(function (d) {
      var b = document.createElement('button'); b.className = 'card'; b.type = 'button';
      b.innerHTML = '<div class="thumb"></div><div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px"><h2></h2><span class="label"></span></div><p></p>';
      b.querySelector('h2').textContent = d.title; b.querySelector('.label').textContent = d.slides.length + ' slides'; b.querySelector('p').textContent = d.desc;
      b.addEventListener('click', function () { location.hash = d.id + '/1'; });
      c.appendChild(b);
      var box = b.querySelector('.thumb'); requestAnimationFrame(function () { mini(d.slides[0].html, box, box.clientWidth || 300); });
    });
  }

  function fit() { var st = $('stage'), f = $('frame'); var s = Math.min((st.clientWidth - 24) / 1920, (st.clientHeight - 24) / 1080); f.style.transform = 'scale(' + s + ')'; }

  function render() {
    var sl = deck.slides[idx]; var f = $('frame'); f.innerHTML = sl.html; videos(f, true);
    var sec = ''; for (var i = idx; i >= 0; i--) if (deck.slides[i].section) { sec = deck.slides[i].section; break; }
    $('dtitle').textContent = deck.title; $('dsection').textContent = sec.split(':')[0];
    $('counter').textContent = (idx + 1) + ' / ' + deck.slides.length;
    $('prev').disabled = idx === 0; $('next').disabled = idx === deck.slides.length - 1;
  }

  function route() {
    if (!DATA) return;
    var h = location.hash.replace('#', '').split('/');
    var d = DATA.decks.filter(function (x) { return x.id === h[0]; })[0];
    if (!d) return showHome();
    deck = d; idx = Math.max(0, Math.min(d.slides.length - 1, (parseInt(h[1], 10) || 1) - 1));
    $('gate').classList.add('hidden'); $('home').classList.add('hidden'); $('viewer').classList.remove('hidden'); $('grid').classList.add('hidden');
    render(); fit();
  }
  function go(n) { if (!deck) return; var i = Math.max(0, Math.min(deck.slides.length - 1, idx + n)); if (i !== idx) location.hash = deck.id + '/' + (i + 1); }

  function toggleGrid() {
    var g = $('grid'); if (!g.classList.contains('hidden')) { g.classList.add('hidden'); return; }
    var list = $('gridList'); list.innerHTML = '';
    deck.slides.forEach(function (s, i) {
      var b = document.createElement('button'); b.type = 'button'; if (i === idx) b.setAttribute('aria-current', 'true');
      b.innerHTML = '<div class="thumb"></div><span class="n"></span>'; b.querySelector('.n').textContent = (i + 1) + ' · ' + s.id;
      b.addEventListener('click', function () { g.classList.add('hidden'); location.hash = deck.id + '/' + (i + 1); });
      list.appendChild(b);
    });
    g.classList.remove('hidden');
    list.querySelectorAll('.thumb').forEach(function (box, i) { mini(deck.slides[i].html, box, box.clientWidth || 240); });
  }

  $('gateForm').addEventListener('submit', function (e) {
    e.preventDefault(); var pw = $('pw').value; $('err').textContent = 'Opening…';
    unlock(pw).then(function (d) { DATA = d; store('eki-decks', pw); $('err').textContent = ''; route(); if (!location.hash) showHome(); })
      .catch(function () { $('err').textContent = 'That password did not work. Check it and try again.'; });
  });
  $('back').addEventListener('click', function () { location.hash = ''; showHome(); });
  $('prev').addEventListener('click', function () { go(-1); });
  $('next').addEventListener('click', function () { go(1); });
  $('gridBtn').addEventListener('click', toggleGrid);
  window.addEventListener('hashchange', route);
  window.addEventListener('resize', function () { if (deck) fit(); });
  document.addEventListener('keydown', function (e) {
    if ($('viewer').classList.contains('hidden') || e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(-1); }
    else if (e.key === 'g' || e.key === 'G') toggleGrid();
    else if (e.key === 'Escape') $('grid').classList.add('hidden');
  });
  var saved = store('eki-decks');
  if (saved) unlock(saved).then(function (d) { DATA = d; route(); if (!location.hash) showHome(); }).catch(function () {});
})();
</script>
</body>
</html>
